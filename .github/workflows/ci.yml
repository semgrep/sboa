name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The dev shell: build, alcotest suites, bundle-tool tests, fmt-check
  # (enterTest in devenv.nix), against nixpkgs' CPython 3.13.
  devenv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Set up Cachix (devenv binary cache)
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: devenv test
        run: devenv test

  # The way an application consumes sboa: opam with OCaml 5.3. discover
  # finds the CPython 3.13 of actions/setup-python as python3.13 on PATH on
  # Linux and macOS; on Windows (python.exe, no python3.13) through
  # SBOA_PREFIX.
  opam:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Best effort on Windows (mingw OCaml against the python.org layout).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up CPython 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: SBOA_PREFIX (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          prefix=$(python -c 'import sys; print(sys.base_prefix.replace(chr(92), "/"))')
          echo "SBOA_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "SBOA_PREFIX=$prefix"
      - name: Set up OCaml 5.3
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.3"
      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build and test
        # bash: in PowerShell (the Windows default) `@install` is splatting
        shell: bash
        run: |
          opam exec -- dune build @install @runtest
          grep python_exe _build/default/config/sboa.config
      # The full bundle-tool suite needs a CPython with the stdlib extension
      # modules built in (python-build-standalone, which uv installs).
      - name: Set up uv
        if: runner.os != 'Windows'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Bundle-tool tests
        if: runner.os != 'Windows'
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uv run --no-project --python 3.13 --with pytest python -m pytest tools/tests -q

  # A machine with uv and no CPython 3.13 (the runner's python3 is 3.12):
  # `uv python install 3.13` is all it takes, discover finds it with
  # `uv python find` (--no-bin: no python3.13 on PATH, so that this job
  # proves that path).
  opam-uv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install CPython 3.13 with uv
        run: |
          uv python install --no-bin 3.13
          if command -v python3.13; then echo "python3.13 on PATH"; exit 1; fi
          python3 --version
      - name: Set up OCaml 5.3
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.3"
      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build and test
        run: |
          opam exec -- dune build @install @runtest
          found=$(sed -n 's/^ *(python_exe "\(.*\)")$/\1/p' _build/default/config/sboa.config)
          echo "python_exe: $found; uv python find: $(uv python find --system 3.13)"
          [ "$found" = "$(uv python find --system 3.13)" ]
